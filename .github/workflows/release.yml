name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TAPPY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret TAPPY_KEYSTORE_BASE64 is not set (see RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TAPPY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TAPPY_KEYSTORE_PASSWORD: ${{ secrets.TAPPY_KEYSTORE_PASSWORD }}
          TAPPY_KEY_ALIAS: ${{ secrets.TAPPY_KEY_ALIAS }}
          TAPPY_KEY_PASSWORD: ${{ secrets.TAPPY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "tappy-$GITHUB_REF_NAME.apk"

      - name: Find changelog
        run: |
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "CHANGELOG=fastlane/metadata/android/en-US/changelogs/$code.txt" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: tappy-${{ github.ref_name }}.apk
          body_path: ${{ env.CHANGELOG }}
